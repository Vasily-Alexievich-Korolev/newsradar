name: Daily News Intelligence
run-name: NewsRadar ${{ github.run_number }}

on:
  schedule:
    # 每个交易日北京时间 06:00 运行（UTC 22:00 前一天，周日至周四）
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libicu-dev

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install \
            akshare pandas requests py_mini_racer \
            python-dateutil openai \
            feedparser beautifulsoup4 lxml

      # ── 抓取 12 项数据 ──
      - name: Fetch all economic & market data
        run: python data_fetch/update_all_eco.py

      # ── 经济分析 ──
      - name: Economic analysis
        run: python news/eco_analysis.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # ── 新闻情报 ──
      - name: News intelligence
        run: python news/news_intelligence.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # ── 构建静态站 ──
      - name: Build site
        run: python news/build_static_site.py

      # ── 提交数据回仓库 ──
      - name: Commit data back to main
        run: |
          git config user.name "newsradar-bot"
          git config user.email "bot@newsradar"
          git add eco_data/ news/reports/ news/events.json \
                  sse_etf_data/ data_stock/
          git commit -m "auto: update $(TZ=Asia/Shanghai date +%Y-%m-%d)" || echo "No changes"
          git pull --rebase
          git push

      # ── 部署到 Pages ──
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./news/static_site
          publish_branch: gh-pages
          force_orphan: true
