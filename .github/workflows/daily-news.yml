name: Daily News Intelligence
run-name: NewsRadar ${{ github.run_number }}

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install feedparser beautifulsoup4 openai pandas akshare requests

      - name: Run economic analysis
        run: python news/eco_analysis.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Run intelligence
        run: python news/news_intelligence.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Build site
        run: python news/build_static_site.py

      - name: Save events and reports back to main
        run: |
          git config user.name "newsradar-bot"
          git config user.email "bot@newsradar"
          git add news/events.json news/reports/
          git commit -m "chore: update events and reports for $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./news/static_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to Pages (attempt 1)
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry if failed
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
